{% extends "base.html" %}
{% block content %}
<div class="card form-card mx-auto p-4 p-md-5">
    <div class="mb-4">
        <p class="text-uppercase text-primary fw-bold mb-2" style="letter-spacing: 0.12rem; font-size: 0.72rem;">Idea</p>
        <h2 class="mb-0 fw-bold">{% if idea %}Edit Idea{% else %}Create New Idea{% endif %}</h2>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label fw-semibold">Title</label>
            <input type="text" id="title" name="title" class="form-control" value="{{ idea.title|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label fw-semibold">Description</label>
            <textarea id="description" name="description" class="form-control" rows="5" required>{{ idea.description|default:'' }}</textarea>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="status" class="form-label fw-semibold">Status</label>
                <select id="status" name="status" class="form-select">
                    <option value="draft" {% if idea and idea.status == 'draft' %}selected{% endif %}>Draft</option>
                    <option value="in_progress" {% if idea and idea.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                    <option value="completed" {% if idea and idea.status == 'completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="rating" class="form-label fw-semibold">Rating</label>
                <select id="rating" name="rating" class="form-select">
                    {% for i in '12345' %}
                        <option value="{{ forloop.counter }}" {% if idea and idea.rating == forloop.counter %}selected{% endif %}>{{ forloop.counter }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label for="tags" class="form-label fw-semibold">Tags</label>
                <input type="text" id="tags" name="tags" class="form-control" value="{% if idea %}{% for tag in idea.tags.all %}{{ tag.name }}{% if not forloop.last %}, {% endif %}{% endfor %}{% endif %}">
            </div>
        </div>

        <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn primary-btn">Save Idea</button>
            <a href="{% url 'idea_list' %}" class="btn btn-outline-secondary secondary-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
